[package]
name = "mdwf-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "MDWF GUI: GTK4 + libadwaita (гл. 04)"

[[bin]]
name = "mdwf-gui"
path = "src/main.rs"

[build-dependencies]
glib-build-tools.workspace = true

[dependencies]
mdwf-core.workspace = true
mdwf-storage.workspace = true
mdwf-secrets.workspace = true
mdwf-scheduler.workspace = true
async-trait.workspace = true
mdwf-providers-ozon.workspace = true
mdwf-providers-wildberries.workspace = true
mdwf-test-provider.workspace = true
mdwf-config.workspace = true
gtk4.workspace = true
libadwaita.workspace = true
glib.workspace = true
gio.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
chrono.workspace = true
# Экспорт списка Архива в xlsx (кнопка «Экспорт» на вкладке «Архив»).
rust_xlsxwriter.workspace = true
# Чтение xlsx для склейки месячных выгрузок в один файл (кнопка «Склеить…»).
calamine.workspace = true
# Проверка обновлений через GitHub Releases API (публичное репо, анонимно).
reqwest.workspace = true
# Named mutex (Windows) / lock file (Unix) для single-instance + AppMutex Inno.
# Внутри — CreateMutexW (safe-обёртка; крейт forbid(unsafe_code), напрямую нельзя).
# Имя mutex = SINGLE_INSTANCE_NAME в main.rs = AppMutex в installer/mdwf.iss.
single-instance = "0.3"
