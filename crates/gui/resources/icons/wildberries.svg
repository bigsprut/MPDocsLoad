<?xml version="1.0" encoding="UTF-8"?>
<!-- Стилизованная иконка Wildberries: фиолетовая (#cb11ab) закруглённая плитка с буквами WB.
     Не является точной копией защищённого логотипа — опознавательный знак по цвету. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <rect x="1" y="1" width="22" height="22" rx="6" ry="6" fill="#cb11ab"/>
  <text x="12" y="16.5" font-family="Arial, Helvetica, sans-serif" font-size="9"
        font-weight="700" fill="#ffffff" text-anchor="middle">WB</text>
</svg>
